<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>高配当株ポートフォリオ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/app.css?v=202609012349">
  <script>
    // 画面の描画前にテーマを確定させ、読み込み時のちらつきを防ぐ
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem('khk.theme') === 'dark' ? 'dark' : 'light';
    } catch (e) {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📈</text></svg>">
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="topbar-brand">
        <h1 class="brand-title">高配当株ポートフォリオ</h1>
        <p class="brand-sub" id="brandSub">読み込み中…</p>
      </div>
      <div class="topbar-right">
        <button class="theme-toggle" id="themeToggle" type="button"
                title="明るい表示と暗い表示を切り替えます">
          <span class="theme-icon" aria-hidden="true"></span>
          <span class="theme-label"></span>
        </button>
        <nav class="tabs" id="tabs">
          <button class="tab" data-view="dashboard">ダッシュボード</button>
          <button class="tab" data-view="holdings">保有一覧</button>
          <button class="tab" data-view="ledger">取引台帳</button>
          <button class="tab" data-view="settings">データ</button>
        </nav>
      </div>
    </header>

    <main class="main" id="main">
      <div class="loading">読み込み中…</div>
    </main>
  </div>

  <div class="modal-root" id="modalRoot" hidden></div>
  <div class="toasts" id="toasts"></div>

  <script type="module" src="./js/app.js?v=202609012349"></script>
</body>
</html>

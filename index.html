<!doctype html>
<html lang="ja">
<head>
  <meta name="app-version" content="202609131403">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>金のニワトリ小屋</title>
  <!-- ホーム画面に置いたときの名前とアイコン(sync/make_icon.py が描く) -->
  <meta name="application-name" content="金のニワトリ小屋">
  <meta name="apple-mobile-web-app-title" content="金のニワトリ小屋">
  <meta name="theme-color" content="#f4f1ec">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/app.css?v=202609131403">
  <script>
    // 画面の描画前にテーマを確定させ、読み込み時のちらつきを防ぐ
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem('khk.theme') === 'dark' ? 'dark' : 'light';
    } catch (e) {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="topbar-brand">
        <h1 class="brand-title">
          <img class="brand-icon" src="./icons/favicon-128.png" alt="" width="40" height="40">
          金のニワトリ小屋
        </h1>
        <p class="brand-sub" id="brandSub">読み込み中…</p>
      </div>
      <div class="topbar-right">
        <button class="theme-toggle" id="themeToggle" type="button"
                title="明るい表示と暗い表示を切り替えます">
          <span class="theme-icon" aria-hidden="true"></span>
          <span class="theme-label"></span>
        </button>
        <nav class="tabs" id="tabs">
          <button class="tab" data-view="dashboard">ダッシュボード</button>
          <button class="tab" data-view="holdings">銘柄一覧</button>
          <button class="tab" data-view="ledger">取引台帳</button>
          <button class="tab" data-view="settings">データ</button>
        </nav>
      </div>
    </header>

    <main class="main" id="main">
      <div class="loading">読み込み中…</div>
    </main>
  </div>

  <div class="modal-root" id="modalRoot" hidden></div>
  <div class="toasts" id="toasts"></div>

  <script type="module" src="./js/app.js?v=202609131403"></script>
</body>
</html>
